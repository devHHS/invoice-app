services:
  db:
    image: 'postgres:15'
    container_name: db
    environment:
      - POSTGRES_DB=invoice-db
      - POSTGRES_USER=compose-postgres
      - POSTGRES_PASSWORD=compose-postgres
    ports:
      - "5432:5432"

  app:
    # 이미지를 Docker Hub에서 받아오는 게 아니라 "현재 폴더의 Dockerfile로 직접 빌드하라"는 키 — 값은 현재 디렉터리를 가리키는 기호 하나
    build: .
    container_name: app
    # db 서비스보다 먼저 뜨면 안 된다는 순서 힌트 — 리스트 형태로 서비스 이름 하나만 적으면 됨
    depends_on:
      - db
    ports:
      # "호스트포트:컨테이너포트" 형태. 스프링부트가 기본으로 쓰는 포트 번호를 떠올려서 양쪽 다 채우기
      - "8080:8080"
    environment:
      # 레슨 0016에서 확인한 대로 — 컨테이너 안에서는 localhost가 아니라 db 서비스 이름으로 DB를 찾아야 함
      # 형태: jdbc:postgresql://<호스트이름>:<포트>/<DB이름>
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/invoice-db
